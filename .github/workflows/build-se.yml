name: Build JM Elemental Arrows SE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-se:
    name: Skyrim SE 1.5.97
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe version

      - name: Configure release
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build release
        shell: pwsh
        run: cmake --build build --config Release --target JM_ElementalArrows -- /m

      - name: Verify SKSE plugin exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_ElementalArrows.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_ElementalArrows.dll was not produced.' }
          $exports = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          $exports | Write-Host
          foreach ($required in @('SKSEPlugin_Load', 'SKSEPlugin_Query', 'SKSEPlugin_Version')) {
            if ($exports -notmatch [regex]::Escape($required)) {
              throw "Missing required SKSE export: $required"
            }
          }

      - name: Stage production candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact\SKSE\Plugins | Out-Null

          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_ElementalArrows.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_ElementalArrows.dll was not produced.' }
          Copy-Item $dll.FullName artifact\SKSE\Plugins\JM_ElementalArrows.dll

          if (-not (Test-Path plugin\JM_ElementalArrows_Overhaul.esp)) {
            throw 'JM_ElementalArrows_Overhaul.esp is missing from the repository.'
          }
          Copy-Item plugin\JM_ElementalArrows_Overhaul.esp artifact\JM_ElementalArrows_Overhaul.esp
          Copy-Item README.md artifact\README.md

          "Source commit: $env:GITHUB_SHA" | Set-Content artifact\BUILD_INFO.txt
          "Runtime: Skyrim SE 1.5.97 / SKSE 2.0.20" | Add-Content artifact\BUILD_INFO.txt
          "Includes instance-aware Soul Trap gem crafting and 5-second Dwarven mechanical shutdown." | Add-Content artifact\BUILD_INFO.txt
          Get-ChildItem artifact -Recurse

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: JM-Elemental-Arrows-SE-1.5.97
          path: artifact/
          if-no-files-found: error
          retention-days: 30
